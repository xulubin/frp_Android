name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 关键改动：直接让 setup-android 装上 platform/build-tools，并自动接受许可
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 打印环境，便于排错
      - name: Show environment
        run: |
          java -version
          gradle --version || true
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT" || true

      # 生成 SDK 定位文件，避免 "SDK location not found"
      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Download frpc -> jniLibs/libfrpc.so
        run: |
          set -e
          curl -fL -o frp.tar.gz \
            https://github.com/fatedier/frp/releases/download/v0.71.0/frp_0.71.0_android_arm64.tar.gz
          echo "845b486c63686990e671f13cc5e3bd130ce7be659ab3c6f043008353451858cb  frp.tar.gz" | sha256sum -c -
          tar -xzf frp.tar.gz
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp frp_0.71.0_android_arm64/frpc app/src/main/jniLibs/arm64-v8a/libfrpc.so
          ls -l app/src/main/jniLibs/arm64-v8a/

      - name: Inject default config (from secret, optional)
        env:
          DEFAULT_CONFIG_JSON: ${{ secrets.DEFAULT_CONFIG_JSON }}
        run: |
          if [ -n "$DEFAULT_CONFIG_JSON" ]; then
            printf '%s' "$DEFAULT_CONFIG_JSON" > app/src/main/assets/default_config.json
          fi

      # 先生成 wrapper 再构建，避免 "gradle: command not found" 之类问题
      - name: Ensure Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: frpc-ondemand-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish Release (only on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
