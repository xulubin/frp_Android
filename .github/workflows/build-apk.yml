name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:            # 支持网页上手动点一下就跑

permissions:
  contents: write               # 打 tag 时用于发布 Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 从官方 Release 下载 frpc，直接改名 libfrpc.so 放进 jniLibs。
      # 好处：仓库里不需要提交 16MB 二进制；也不受本地杀软误删影响。
      - name: Download frpc -> jniLibs/libfrpc.so
        run: |
          set -e
          curl -fL -o frp.tar.gz \
            https://github.com/fatedier/frp/releases/download/v0.71.0/frp_0.71.0_android_arm64.tar.gz
          echo "845b486c63686990e671f13cc5e3bd130ce7be659ab3c6f043008353451858cb  frp.tar.gz" | sha256sum -c -
          tar -xzf frp.tar.gz
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp frp_0.71.0_android_arm64/frpc app/src/main/jniLibs/arm64-v8a/libfrpc.so
          ls -l app/src/main/jniLibs/arm64-v8a/

      # 用仓库 Secret 注入出厂默认配置，避免把 token 写进代码。
      # 未设置 Secret 时，保留仓库里的占位版 default_config.json。
      - name: Inject default config (from secret, optional)
        env:
          DEFAULT_CONFIG_JSON: ${{ secrets.DEFAULT_CONFIG_JSON }}
        run: |
          if [ -n "$DEFAULT_CONFIG_JSON" ]; then
            printf '%s' "$DEFAULT_CONFIG_JSON" > app/src/main/assets/default_config.json
          fi

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: frpc-ondemand-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish Release (only on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
